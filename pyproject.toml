[project]
name = "paijo"
version = "0.1.0"
description = "Minimalist terminal chat interface for a Python coding agent."
readme = "README.md"
authors = [
    { name = "rijalsolahudin", email = "rijalsolahudin17@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aisuite[openai]>=0.2.0",
    "openai>=1.109.1",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
]

[project.scripts]
paijo = "app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["tools", "ui", "core"]
py-modules = [
    "app",
    "version",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Prompt/system-message strings are intentionally long.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
